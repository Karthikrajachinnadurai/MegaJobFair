[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karthikrajachinnadurai", email = "karthikrajachinnadurai@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "gspread>=6.2.1",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.58",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-service = "ai_service:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
